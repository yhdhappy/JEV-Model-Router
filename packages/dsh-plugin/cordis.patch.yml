# dsh-plugin-jev-router bundle patch.
#
# Mounts two capabilities:
#   * `/jev`      — observation-only JEV classification (P0)
#   * `自动选择`   — a synthetic `jev-router/auto` model that routes each user
#                   turn to a concrete configured model (P1)
#
# Routing is opt-in: nothing changes until the user selects "自动选择" in the
# model picker.
#
# Do not commit a machine-specific apiKeyFile path here. Configure it locally
# after installation, or set JEV_API_KEY_FILE in the launching environment.
# The repository intentionally contains no local credential path or key.

- insert:
    - id: jev-router
      name: 'dsh-plugin-jev-router'
      config:
        timeoutMs: 30000
        # Set autoRoute: false to remove "自动选择" from the picker entirely.
        autoRoute: true
        # What to do when JEV returns a task type no configured model declares
        # (it returns `other` for meta and conversational work):
        #   capability_only (default) — drop the task-type filter, keep the
        #                               capability floor, so such turns still
        #                               land on an appropriately sized model
        #   safe_default              — treat it as "no eligible model" and use
        #                               safeDefault below
        unmatchedTaskType: 'capability_only'
        # Allowlisted trivial tasks (read one explicit file, list the current
        # directory) are answered without calling JEV at all, removing the
        # classifier's ~750ms latency and its cost for those turns.
        # Set false to send every task through JEV.
        lightRules: true
        # Per-turn spend ceiling in USD. null / omitted disables the guard.
        # 1.50 is this machine's current setting, NOT a frozen protocol
        # constant. A call is allowed only when
        # current_exposure + estimated_next_max_cost <= budgetLimit;
        # equality is allowed. A call that would exceed it is not made at all —
        # the guard never swaps to a cheaper model to fit.
        budgetLimit: 1.50
        # Model used when JEV cannot decide. Never the cheapest tier.
        safeDefault:
          provider: 'opencode-go'
          model: 'gpt-5.6-luna'
